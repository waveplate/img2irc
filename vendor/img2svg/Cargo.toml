[package]
name = "img2svg"
version = "0.1.15"
edition = "2024"
description = "Raster-to-SVG vectorization library (vendored for quiet embedding)"
license = "Apache-2.0"
repository = "https://github.com/yingkitw/img2svg"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[features]
default = []
quiet = []
mcp = ["dep:serde", "dep:serde_json"]

[dependencies]
image = "0.24"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
svg = "0.13"
rgb = "0.8"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
rand = "0.10"
