[package]
name = "img2irc-rs"
version = "1.3.1"
authors = ["waveplate"]
github = "https://github.com/waveplate/img2irc"
repository = "https://github.com/waveplate/img2irc"
description = "CLI utility to convert images to halfblock ANSI or IRC art with various optional post-processing filters"
license = "GPL-3.0-only"
readme = "README.md"
edition = "2021"

[profile.release]
#lto = true
#codegen-units = 1
#opt-level = "z"
#strip = true  # Automatically strip symbols from the binary.
split-debuginfo = "unpacked"
opt-level = 3

[profile.release.package."*"]
opt-level = 3


[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[[bin]]
name = "img2irc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = "0.11.14"
photon-rs = "0.3.3"
clap = { version = "4.2.0", features = ["cargo", "derive"] }
url = "2.3.1"
atty = "0.2.14"
once_cell = "1.21.3"
fontconfig = "0.10"
freetype-rs = "0.31"
toml = "0.8"
serde = "1.0.228"
bincode = "1.3"
rayon = "1.11.0"
image = "0.25.9"
png = "0.18.0"
wgpu = "27.0.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
resvg = "0.41.0"
tiny-skia = "0.11.0"
base64 = "0.22.1"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"
tui-textarea = "0.7.0"
ansi-to-tui = "7.0"
ratatui-explorer = { path = "./ratatui-explorer" }
simplelog = "0.12.2"
log = "0.4.29"
imageproc = "0.26.0"
mlua = { version = "0.11", features = ["luajit", "serialize", "send"] }
ratatui-image = { path = "./ratatui-image", default-features = false, features = ["crossterm"] }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
