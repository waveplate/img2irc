[package]
name = "img2irc-rs"
version = "2.0.0-alpha"
authors = ["waveplate"]
github = "https://github.com/waveplate/img2irc"
repository = "https://github.com/waveplate/img2irc"
description = "CLI utility to convert images to halfblock ANSI or IRC art with various optional post-processing filters"
license = "GPL-3.0-only"
readme = "README.md"
edition = "2021"
build = "build.rs"

[profile.release]
#lto = true
#codegen-units = 1
#opt-level = "z"
#strip = true  # Automatically strip symbols from the binary.
split-debuginfo = "unpacked"
opt-level = 3

[profile.release.package."*"]
opt-level = 3

[[bin]]
name = "img2irc"
path = "src/main.rs"

[features]
default = ["ocr"]
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]
ocr = ["dep:figlet-rs", "dep:libc", "dep:ppocr-rs"]
vendored-openssl = ["dep:openssl"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.11.14", features = ["blocking"] }
ureq = "2.12.1"
photon-rs = "0.3.3"
clap = { version = "4.2.0", features = ["cargo", "derive"] }
url = "2.3.1"
atty = "0.2.14"
once_cell = "1.21.3"
fontdb = "0.16"
ab_glyph = "0.2"
swash = "0.1.19"
libz-sys = { version = "1", features = ["static"] }
toml = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rayon = "1.11.0"
dashmap = "6.1.0"
image = "0.25.9"
png = "0.18.0"
wgpu = { version = "27.0.1", optional = true }
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }
resvg = "0.41.0"
tiny-skia = "0.11.0"
base64 = "0.22.1"
ratatui = { version = "0.30", features = ["all-widgets", "unstable-widget-ref"] }
crossterm = "0.29"
ratatui-textarea = "0.9"
ansi-to-tui = "8"
simplelog = "0.12.2"
log = "0.4.29"
imageproc = "0.26.0"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send"] }
ratatui-image = { version = "10.0.7", default-features = false, features = ["crossterm"] }
pollster = { version = "0.4.0", optional = true }
unicode-width = "0.2.0"
unicode-linebreak = "0.1.5"
educe = "0.6"
regex = "1.11"
arboard = "3.4.1"
ppocr-rs = { version = "0.7.3", features = ["fetch-models", "test-binaries"], optional = true }
figlet-rs = { version = "1.0.0", optional = true }
libc = { version = "0.2", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
