# ==============================================================================
# BLOCK ELEMENTS
# ==============================================================================

[ascii.space]
glyphs = [0x20]

[blocks.full]
glyphs = [0x2588]

[blocks.half]
glyphs = [0x2580]

[blocks.quarter]
ranges = [[0x2596, 0x259F]]

[blocks.eighth]
ranges = [
    [0x2581, 0x2587], # Lower
    [0x2589, 0x258F], # Left
    [0x2594, 0x2595]  # Top/Right
]

# ==============================================================================
# LEGACY COMPUTING
# ==============================================================================

[legacy.base.sextants] # sextants
ranges = [[0x1FB00, 0x1FB3B]]

[legacy.base.polygons] # Triangles, quadrilaterals, and polygonal fills
ranges = [[0x1FB3C, 0x1FB6F]]

[legacy.base.lines] # Vertical and Horizontal smooth bars
ranges = [[0x1FB70, 0x1FB7B]]

[legacy.base.fills] # Various block fills and large type elements
ranges = [[0x1FB7C, 0x1FB9F]]

[legacy.supplement.octants] # octants
ranges = [[0x1CD00, 0x1CDE5]]

[legacy.supplement.sextants] # sextants, supplement
ranges = [[0x1CE51, 0x1CE8F]]

# ==============================================================================
# COMPOSITES
# ==============================================================================

[default]
include = [
    "ascii.space",
    "blocks.eighth",
    "legacy.base.polygons"
]
